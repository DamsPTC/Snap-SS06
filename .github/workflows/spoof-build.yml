name: Build spoofed IPA

on:
  pull_request:
    paths:
      - 'spoof/**'
      - '.github/workflows/spoof-build.yml'
  push:
    branches: [main]
    paths:
      - 'spoof/**'
      - '.github/workflows/spoof-build.yml'
  workflow_dispatch:
    inputs:
      BUILD_VARIANT:
        description: Variante à construire (all = les huit variantes)
        required: true
        default: all
        type: choice
        options:
          - all
          - none
          - swizzle
          - full
          - dccheckoff
          - noattest
          - logonly
          - selfread
          - selfblock

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.variant }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["logonly"]' || inputs.BUILD_VARIANT == 'all' && '["none","swizzle","full","dccheckoff","noattest","logonly","selfread","selfblock"]' || format('["{0}"]', inputs.BUILD_VARIANT)) }}
    env:
      BUILD_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout (avec Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
          sparse-checkout: |
            spoof
            extracted
          sparse-checkout-cone-mode: true

      - name: Python pour l'analyse locale logonly
        if: ${{ matrix.variant == 'logonly' || matrix.variant == 'selfread' || matrix.variant == 'selfblock' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assembler l'IPA
        run: bash spoof/build_spoof_ipa.sh

      - name: Résumer le résultat
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          variant = os.environ['BUILD_VARIANT']
          manifest = json.loads(pathlib.Path(f'build/Snap-SS06-14.25.0.48-{variant}.manifest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Variante : **{variant}**\n\nIPA : `{manifest['ipa']}`\n\n")
              summary.write(f"Taille : {manifest['ipa_bytes']} octets\n\nSHA-256 : `{manifest['ipa_sha256']}`\n\n")
              summary.write(f"Dylib : `{manifest['dylib_present']}` ; interposition Keychain compilée : `{manifest['keychain_interposition_compiled']}`.\n\n")
              summary.write(f"Swizzles compilés : IDFV/IDFA `{manifest['idfv_idfa_swizzles_compiled']}` ; DeviceCheck NO `{manifest['devicecheck_is_supported_no_compiled']}` ; attestation login nil `{manifest['login_attestation_nil_compiled']}`.\n\n")
              summary.write(f"Observateurs logonly : `{manifest['logonly_observers_compiled']}` ; tests de transmission sur hôte macOS : `{manifest['logonly_host_tests_passed']}`.\n\n")
              summary.write(f"Historique horodaté : `{manifest['logonly_timestamped_history_compiled']}` ; copie automatique : `{manifest['logonly_automatic_clipboard_compiled']}` ; tests du presse-papiers simulé : `{manifest['logonly_clipboard_host_tests_passed']}`.\n\n")
              summary.write(f"Trace : `{manifest['logonly_trace_version']}` ; cibles transport compilées : `{manifest['logonly_transport_targets_compiled']}` ; tests des observateurs transport : `{manifest['logonly_transport_host_tests_passed']}`.\n\n")
              summary.write(f"Dumps locaux : `{manifest['logonly_value_dumps_compiled']}` ; tests des valeurs : `{manifest['logonly_value_dump_host_tests_passed']}` ; tests protobuf/comparaison : `{manifest['logonly_offline_analysis_tests_passed']}`.\n\n")
              summary.write(f"Réponses RPC corrélées : `{manifest['logonly_request_response_correlation_compiled']}` ; tests des callbacks : `{manifest['logonly_response_host_tests_passed']}` ; empreintes d’attestation : `{manifest['logonly_attestation_fingerprints_compiled']}`.\n\n")
              summary.write(f"Interposition POSIX selfread : `{manifest['selfread_posix_interposition_compiled']}` ; fonctions : `{manifest['selfread_interposed_functions']}` ; tests dyld macOS : `{manifest['selfread_dyld_host_tests_passed']}`.\n\n")
              summary.write(f"Échec mmap selfblock : `{manifest['selfblock_mmap_failure_compiled']}`; tests fenêtre d'attestation :`{manifest['selfblock_attestation_window_host_tests_passed']}`.\n\n")
              summary.write('Repères du principal après re-signature (offsets en décimal) :\n\n```json\n' + json.dumps(manifest['repacked_main_macho_landmarks'], indent=2) + '\n```\n\n')
              summary.write('Signature ad hoc : une nouvelle signature est nécessaire pour une installation iOS standard.\n')
              summary.write('Contrôles statiques réussis ; fonctionnement sur appareil non testé.\n')
          PY

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Snap-SS06-spoofed-ipa-${{ matrix.variant }}
          path: |
            build/Snap-SS06-14.25.0.48-${{ matrix.variant }}.ipa
            build/Snap-SS06-14.25.0.48-${{ matrix.variant }}.manifest.json
          if-no-files-found: error
          compression-level: 0

  publish-logonly:
    name: Publier l'IPA logonly en release
    needs: build
    if: ${{ github.event_name == 'push' || inputs.BUILD_VARIANT == 'all' || inputs.BUILD_VARIANT == 'logonly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Télécharger l'artefact logonly de cette exécution
        uses: actions/download-artifact@v4
        with:
          name: Snap-SS06-spoofed-ipa-logonly
          path: release

      - name: Vérifier la provenance et préparer les notes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          directory = pathlib.Path('release')
          ipa = directory / 'Snap-SS06-14.25.0.48-logonly.ipa'
          manifest_path = directory / 'Snap-SS06-14.25.0.48-logonly.manifest.json'
          manifest = json.loads(manifest_path.read_text())
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          assert manifest['variant'] == 'logonly' and manifest['ipa'] == ipa.name
          assert manifest['github_sha'] == os.environ['GITHUB_SHA']
          assert str(manifest['github_run_id']) == os.environ['GITHUB_RUN_ID']
          assert manifest['ipa_bytes'] == ipa.stat().st_size
          assert manifest['ipa_sha256'] == digest(ipa)
          assert manifest['dylib_present'] and manifest['logonly_observers_compiled']
          assert manifest['logonly_host_tests_passed'] and manifest['static_checks_passed']
          assert manifest['logonly_timestamped_history_compiled']
          assert manifest['logonly_automatic_clipboard_compiled']
          assert manifest['logonly_clipboard_host_tests_passed']
          assert manifest['logonly_trace_version'] == 'responses-v8'
          assert manifest['logonly_transport_targets_compiled'] == 34
          assert manifest['logonly_transport_host_tests_passed']
          assert manifest['logonly_value_dumps_compiled']
          assert manifest['logonly_value_dump_host_tests_passed']
          assert manifest['logonly_offline_analysis_tests_passed']
          assert manifest['logonly_response_callbacks_compiled']
          assert manifest['logonly_response_host_tests_passed']
          assert manifest['logonly_request_response_correlation_compiled']
          assert manifest['logonly_attestation_fingerprints_compiled']
          assert manifest['logonly_nested_login_header_compiled']
          assert manifest['logonly_oneof_error_presence_compiled']
          assert manifest['logonly_schema_host_tests_passed']
          assert manifest['logonly_status_enum_names_compiled']
          assert manifest['logonly_error_message_preview_compiled']
          assert manifest['logonly_response_diagnostics_host_tests_passed']
          assert manifest['logonly_registration_header_compiled']
          assert manifest['logonly_predecode_receive_observer_compiled']
          assert manifest['logonly_origin_host_tests_passed']
          assert manifest['logonly_native_metrics_observer_compiled']
          assert manifest['logonly_native_metrics_host_tests_passed']
          assert manifest['logonly_native_metrics_activation'] == 'passive'
          assert manifest['logonly_network_origin_proven'] is False
          for key in ('keychain_interposition_compiled', 'idfv_idfa_swizzles_compiled',
                      'devicecheck_is_supported_no_compiled', 'login_attestation_nil_compiled'):
              assert manifest[key] is False, key
          assets = [{'name': p.name, 'size': p.stat().st_size, 'digest': 'sha256:' + digest(p)}
                    for p in (ipa, manifest_path)]
          (directory / 'verified-assets.json').write_text(json.dumps(assets))
          notes = '\n'.join([
              'Variante de diagnostic **logonly**, sans remplacement des valeurs.',
              '',
              'Trace **responses-v8** : les 27 callbacks Janus compatibles relient chaque réponse au call de sa requête. Les 34 points d’observation et les deux points métier sont conservés.',
              'Les blocs RPC sont enveloppés uniquement si leur signature void(response, error) est vérifiée. Les arguments, la file et les exceptions de chaque invocation sont conservés. Un handler absent ou incompatible reste intact et est signalé.',
              'rpc.local_return et transport.local_return désignent le retour local. rpc.response contient les métadonnées de la réponse décodée ou de l’erreur de transport : statut brut, codes SS extraits de errorData.humanReadableErrorMessage, NSError domain/code. Aucun corps complet de requête/réponse ni NSError.userInfo n’est sérialisé.',
              'Depuis responses-v6 : status_enum et status_name proviennent du descripteur protobuf du champ statusCode. La valeur numérique reste disponible si le nom est inconnu ou son descripteur indisponible ; aucun sens n’est attribué arbitrairement au statut 16.',
              'message_preview expose le seul champ humanReadableErrorMessage après filtrage patterns-v1 : valeurs étiquetées sensibles, autorisations, emails, numéros longs/téléphones, URL, UUID et chaînes opaques longues. Le HTML et les caractères de contrôle sont retirés. Ce filtrage est heuristique et ne garantit pas la suppression de toute donnée personnelle en texte libre.',
              'Le filtre traite au plus 4096 caractères UTF-16 complets puis limite l’aperçu à 1024 unités sans couper une paire de substitution. Une entrée plus longue est omise. message_preview_state, message_preview_redacted et message_preview_truncated rendent ces limites visibles. Les codes SSxx sont reconnus sans distinction de casse et normalisés en majuscules.',
              'rpc.request contient la longueur et l’empreinte SHA-256 du champ clientAttestationPayload de la requête. attestation.fingerprint permet de comparer cette empreinte au retour du générateur.',
              'Correction responses-v5 : les champs de LoginWithPassword sont lus dans loginHeader après vérification de hasLoginHeader. request_context_source précise le conteneur observé. Un header absent reste absent.',
              'La présence de errorData est déterminée par hasErrorData ou par payloadOneOfCase comparé au numéro du champ provenant du descripteur protobuf. error_data_presence_source, payload_oneof_case et error_data_field_number rendent ce contrôle vérifiable ; aucun numéro de branche n’est supposé.',
              'Captures complètes : retour de _getAttestationPayload:path:requestType: en base64, chaîne du callback DeviceCheck et valeur affectée à iosDeviceCheckToken. Les dumps portent un chemin RPC lorsqu’il est disponible ; DeviceCheck et son setter portent requestPath=unknown.',
              'Chaque événement [SS06LogOnly] est horodaté en UTC et ajouté à un historique en mémoire. Chaque nouvelle mesure déclenche la copie de l’historique complet dans le presse-papiers ; les lignes reçues lorsque l’app est inactive sont copiées à son activation.',
              'Utilisation : lancer l’app, tenter le login/inscription, attendre l’erreur, puis ouvrir Notes et coller. Vérifier trace=responses-v8, transport_observers installed=34 expected=34, callback_observer state=wrapped et rpc.response portant le même call que rpc.request.',
              'La copie remplace le contenu du presse-papiers local et contient désormais les valeurs sensibles complètes, également émises par NSLog. Aucun upload de captures. L’historique en mémoire repart à zéro au prochain processus.',
              'Les captures historiques décrivent seulement les payloads. Une nouvelle capture sur appareil reste nécessaire. Un SS06 présent dans la réponse décodée établit sa présence à cette frontière ; le contrôle interne ayant motivé le refus reste inconnu.',
              '',
              f"Commit : `{manifest['github_sha']}`.",
              f"Build : https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              f"IPA : {manifest['ipa_bytes']} octets ; SHA-256 `{manifest['ipa_sha256']}`.",
              '',
              'Tests hôte macOS : 34 signatures, 27 callbacks corrélés, réponses synchrones/asynchrones et hors ordre, erreurs de transport, garde de signature, absence de sous-message, identité/file/exceptions, empreinte connue, captures et presse-papiers simulé. Tests Python et contrôles statiques réussis. Aucun test du client sur iOS.',
              'Régressions responses-v5 : loginHeader présent/absent, oneof sans hasErrorData, deux numéros de champ synthétiques différents, branche non sélectionnée et descripteur indisponible/incompatible. La règle serveur demeure inconnue.',
              'Régressions responses-v6 : même statut numérique avec deux libellés de schéma, statut inconnu, type de méthode incompatible, exceptions du descripteur, aperçu sans code SS, masquage des formats sensibles et limites Unicode. Les réponses originales restent intactes et les callbacks sont transmis.',
              'Nouveau responses-v7 : registrationHeader est lu avec contrôle de présence ; transport.bind relie le handler concret à sa requête ; transport.event observe onEvent:status: avant décodage. Statut gRPC et statut Janus restent distincts.',
              'Les octets existants de la réponse sont inspectés sans dump : taille, SHA-256, champs de statut/erreur choisis par le descripteur protobuf pour LoginWithPassword et RegisterWithUsernamePassword, aperçu filtré et codes SS. Les corps de plus de 256 Kio, messages répétés et formats non pris en charge ne reçoivent pas de verdict inventé.',
              'rpc.response porte transport_delivery_link=same_onEvent_stack seulement si le callback se produit dans cet événement lié à la même requête. Une absence de lien ne prouve pas un refus local. origin_stack conserve uniquement des noms de binaires et offsets pour retrouver les appelants.',
              'Vérifier receive_observer installed=1 expected=1. Un refus présent dans transport.event est déjà présent avant le décodage Janus ; il ne prouve pas à lui seul un paquet reçu du serveur ni sa règle privée. network_origin=unverified et server_rule=unknown restent explicites.',
              'Tests v7 : header inscription absent/présent, deux numéros de statut issus de schémas synthétiques, données tronquées/malformées/trop grandes/répétées, handlers hors ordre, statut transport, exceptions et identité des arguments/file. Le client iOS doit encore être testé sur appareil.',
              'Nouveau responses-v8 : observateur passif de SCGrpcEventLogger.logUnaryBlizzard:. Vérifier metrics_observer installed=1 expected=1 activation=passive puis transport.metrics. Aucun appel à enableMetrics ni remplacement du delegate.',
              'Les métriques natives Auth/Argos restent distinctes du verdict Janus : authSuccess/argosSuccess conservent nil, false, true et leurs états de lecture ; statusCode reste un code natif non interprété comme statut Janus. Latences, mesures réseau, hôte et empreintes SHA-256 des identifiants taskId/requestId sont relevés. Les identifiants bruts et consistentIdTracking ne sont pas publiés.',
              'Une métrique asynchrone reste rpc_link=unverified. Aucun rapprochement automatique par dernier appel, chemin, délai ou taille. Une absence de transport.metrics ne prouve ni une absence de trafic ni un refus local. Le sens exact des indicateurs Auth/Argos et la règle serveur doivent encore être établis.',
              'Tests v8 : états nil/false/true, types incompatibles, getter en exception, filtrage exact des chemins, empreintes des identifiants, absence de lien RPC périmé, arguments/file/exceptions originales préservés.',
              'Signature ad hoc : nouvelle signature/provisionnement nécessaires pour une installation iOS standard.',
              '',
              f"[Lecture des logs et limites](https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{manifest['github_sha']}/spoof/README.md#observer-les-longueurs-avec-logonly)",
              f"[Captures et analyse protobuf](https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{manifest['github_sha']}/docs/attestation-capture-analysis.md)",
          ])
          (directory / 'notes.md').write_text(notes + '\n')
          PY

      - name: Publier les fichiers IPA et manifeste vérifiés
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v14.25.0.48-logonly-${GITHUB_RUN_ID}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Cette release existe déjà ; aucun fichier ne sera remplacé." >&2
            exit 1
          fi
          gh release create "$tag" \
            release/Snap-SS06-14.25.0.48-logonly.ipa \
            release/Snap-SS06-14.25.0.48-logonly.manifest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease --title "Snap SS06 14.25.0.48 — logonly (${GITHUB_RUN_ID})" \
            --notes-file release/notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\")" > release/published.json
          python3 - <<'PY'
          import json, os, pathlib
          release = json.loads(pathlib.Path('release/published.json').read_text())
          expected = json.loads(pathlib.Path('release/verified-assets.json').read_text())
          assert len(release['assets']) == len(expected)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for item in expected:
                  asset, = [a for a in release['assets'] if a['name'] == item['name']]
                  assert asset['size'] == item['size'] and asset['digest'] == item['digest']
                  assert asset['state'] == 'uploaded'
                  summary.write(f"[{asset['name']}]({asset['browser_download_url']})\n\n")
          PY
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
